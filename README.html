<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>於听</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --text-soft: #737373;
    --border: #dbdbdb;
    --btn-bg: #efefef;
    --tag-bg: #f5f5f5;
    --chat-bubble-me: #000000;
    --chat-text-me: #ffffff;
    --chat-bubble-yu: #efefef;
    --chat-text-yu: #000000;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 加载页 ============ */
  .loading-screen {
    position: fixed; inset: 0; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); transition: opacity .5s ease, visibility .5s;
  }
  .loading-screen.hide { opacity: 0; visibility: hidden; }
  
  .loader {
    width: 36px; height: 36px;
    border: 2px solid #f3f3f3; border-top: 2px solid var(--text);
    border-radius: 50%; 
    animation: spin 2s linear forwards; 
  }
  @keyframes spin { to { transform: rotate(720deg); } }
  
  .loading-text { 
    margin-top: 16px; font-size: 13px; color: var(--text); 
    letter-spacing: 2px; font-weight: 500; min-height: 20px;
    font-family: 'Courier New', Courier, monospace;
  }
  .typing-cursor-load { 
    display: inline-block; width: 2px; height: 14px; 
    background: var(--text); vertical-align: middle; 
    margin-left: 2px; animation: blink 0.8s step-end infinite; 
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ 通用屏幕 ============ */
  .screen { display: none; }
  .screen.active {
    display: flex; flex-direction: column;
    max-width: 470px; margin: 0 auto;
    padding: 20px 20px 60px; min-height: 100vh; min-height: 100dvh;
    animation: fadeIn .4s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ============ 顶部导航与小按钮 ============ */
  .top-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding: 0 4px; position: relative;
  }
  .nav-icon {
    width: 24px; height: 24px; cursor: pointer;
    color: var(--text); position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  
  .red-dot {
    position: absolute; top: -1px; right: -1px;
    width: 7px; height: 7px; background: #ff3b30; border-radius: 50%;
    transition: opacity .2s;
  }

  .dropdown-menu {
    position: absolute; top: 36px; right: 0;
    background: #fff; border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 6px; opacity: 0; visibility: hidden;
    transform: translateY(-5px); transition: all .2s;
    z-index: 100;
  }
  .dropdown-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
  
  .menu-item {
    padding: 10px 16px; font-size: 13.5px; border-radius: 6px;
    cursor: pointer; white-space: nowrap; display: flex; align-items: center; justify-content: space-between;
    transition: background .2s;
  }
  .menu-item:hover { background: #f5f5f5; }
  
  .heart-icon {
    margin-left: 12px; font-size: 16px; color: #d1d1d1;
    transition: color 0.25s ease, transform 0.15s ease;
  }
  .heart-icon:active { transform: scale(1.2); }

  /* ============ 主页信息区 ============ */
  .top-section { display: flex; align-items: center; gap: 24px; margin-bottom: 18px; }
  
  .avatar-wrap {
    width: 86px; height: 86px; flex-shrink: 0;
    border-radius: 50%; padding: 2px; border: 1px solid var(--border);
  }
  /* 头像修改为无衬线黑体 */
  .avatar {
    width: 100%; height: 100%; border-radius: 50%;
    background: #fff; display: flex; justify-content: center; align-items: center;
    font-size: 26px; font-weight: 500;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #000; user-select: none;
  }

  .info-wrap { flex: 1; }
  .username { margin: 0 0 12px 0; font-size: 18px; font-weight: 600; }
  .stats { display: flex; gap: 24px; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat b { font-size: 16px; font-weight: 600; }
  .stat span { font-size: 13px; color: var(--text-soft); margin-top: 2px; }

  .bio { font-size: 14px; line-height: 1.5; margin: 0 0 20px 0; padding: 0 4px; }
  
  .tags { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; padding: 0 4px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12.5px; color: var(--text-soft); background: var(--tag-bg); padding: 4px 10px; border-radius: 6px; }

  .action-row { display: flex; gap: 8px; margin-bottom: 30px; padding: 0 4px; }
  .follow-btn {
    flex: 1; padding: 8px 0; border: none; border-radius: 8px;
    background: var(--btn-bg); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s;
  }
  .follow-btn:active { background: #e0e0e0; }
  .icon-btn {
    width: 38px; display: flex; align-items: center; justify-content: center;
    background: var(--btn-bg); border: none; border-radius: 8px; cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; }

  .modules { display: flex; flex-direction: column; gap: 12px; padding: 0 4px; margin-bottom: 30px; }
  .module {
    display: block; padding: 16px; border: 1px solid var(--border); border-radius: 12px;
    text-decoration: none; color: inherit; transition: background .2s;
  }
  .module:active { background: #fafafa; }
  .module h3 { margin: 0 0 6px 0; font-size: 14.5px; font-weight: 600; }
  .module p { margin: 0; font-size: 13px; color: var(--text-soft); line-height: 1.5; }
  .module.pending, .module.clickable { cursor: pointer; }

  /* ============ 须知页面 ============ */
  #noticePage { background: #fafafa; }
  .notice-content {
    padding: 10px 4px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .notice-line { display: flex; flex-wrap: wrap; align-items: flex-start; }
  .notice-char {
    display: inline-block;
    opacity: 0; transform: translateX(-15px);
    animation: slideInChar 0.3s ease forwards;
  }
  @keyframes slideInChar { to { opacity: 1; transform: translateX(0); } }

  /* ============ 聊天页 ============ */
  #chat { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; max-width: 500px; margin: 0 auto; background: var(--bg); }
  #chat.active { display: flex; animation: slideUp .3s ease both; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  .chat-header { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fff; }
  .back-btn { border: none; background: none; padding: 0 12px 0 0; font-size: 24px; cursor: pointer; color: var(--text); }
  .chat-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
  
  /* 聊天小头像修改为无衬线黑体 */
  .mini-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 1px solid var(--border);
    display: flex; justify-content: center; align-items: center; 
    font-size: 11px; font-weight: 500; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .chat-body { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .bubble {
    max-width: 75%; padding: 10px 14px; border-radius: 18px;
    font-size: 14.5px; line-height: 1.6; word-break: break-word; animation: pop .2s ease both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .bubble.yu { align-self: flex-start; background: var(--chat-bubble-yu); color: var(--chat-text-yu); border-bottom-left-radius: 4px; }
  .bubble.me { align-self: flex-end; background: var(--chat-bubble-me); color: var(--chat-text-me); border-bottom-right-radius: 4px; }

  .typing-cursor { display: inline-block; font-weight: 300; color: currentColor; animation: blink 0.8s step-end infinite; margin-left: 1px; vertical-align: text-bottom; }
  @keyframes blink { 50% { opacity: 0; } }

  .chat-input { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: #fff; display: flex; flex-direction: column; gap: 10px; }
  .input-hint { font-size: 12px; color: var(--text-soft); text-align: center; transition: opacity .3s; }
  .chat-input.disabled .input-hint { opacity: 0.4; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #fff; color: var(--text); font-size: 14px; text-align: left; cursor: pointer; transition: background .2s; animation: pop .2s ease both; }
  .opt-btn:active { background: #f5f5f5; }
  .back-home-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--text); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; animation: pop .3s ease both; }

  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(10px); background: rgba(0,0,0,0.8); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .3s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ===== 加载页 ===== -->
<div class="loading-screen" id="loadingScreen">
  <div class="loader"></div>
  <div class="loading-text" id="loadingText"></div>
</div>

<!-- ===== 主页 ===== -->
<main class="screen" id="profile">
  
  <!-- 顶部导航与小按钮 -->
  <div class="top-nav">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </div>
    <div class="nav-icon" id="bellBtn">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <div class="red-dot" id="redDot"></div>
      <!-- 下拉菜单 -->
      <div class="dropdown-menu" id="dropdownMenu">
        <div class="menu-item" id="likeBtn">
          喜欢 <span class="heart-icon" id="heartIcon">♥</span>
        </div>
      </div>
    </div>
  </div>

  <div class="top-section">
    <div class="avatar-wrap">
      <div class="avatar">Yu</div>
    </div>
    
    <div class="info-wrap">
      <h1 class="username">於听</h1>
      <div class="stats">
        <div class="stat"><b>1</b><span>关注</span></div>
        <div class="stat"><b>1</b><span>粉丝</span></div>
        <div class="stat"><b>1</b><span>互关</span></div>
      </div>
    </div>
  </div>

  <p class="bio">等到冬天我们一起手拉手去散步吧。</p>

  <div class="tags">
    <div class="tag-row">
      <span class="tag">#Le-H</span>
      <span class="tag">#20</span>
      <span class="tag">#火象狮子</span>
      <span class="tag">#ISFP</span>
    </div>
    <div class="tag-row">
      <span class="tag">#1.7耳鸟</span>
      <span class="tag">#长期四无</span>
    </div>
  </div>

  <div class="action-row">
    <button class="follow-btn" id="followBtn">关注</button>
    <button class="icon-btn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>

  <div class="modules">
    <a class="module" href="https://www.kdocs.cn/l/cmTJz3pHj5yg" target="_blank" rel="noopener">
      <h3>风格话术一览</h3>
      <p>高互动 日常暧昧 微擦动描<br>虚病 恶趣挑逗 直球狗1 老婆全肯定</p>
    </a>

    <div class="module clickable" id="noticeModule">
      <h3>单前必读须知</h3>
      <p>建议阅读，以便有更舒适的体验。</p>
    </div>

    <a class="module" href="https://www.kdocs.cn/l/cta0lloMptSD" target="_blank" rel="noopener">
      <h3>板评一览</h3>
    </a>

    <div class="module pending" id="pendingModule">
      <h3>未完待续…</h3>
    </div>
  </div>
</main>

<!-- ===== 须知页面 ===== -->
<section class="screen" id="noticePage">
  <div class="top-nav">
    <div class="nav-icon" id="closeNoticeBtn">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-weight:600; font-size:15px;">单前须知</div>
    <div style="width:24px;"></div>
  </div>
  <div class="notice-content" id="noticeContent">
    <!-- 逐字动画由 JS 动态生成 -->
  </div>
</section>

<!-- ===== 聊天页 ===== -->
<section id="chat">
  <header class="chat-header">
    <button class="back-btn" id="chatBack">‹</button>
    <div class="chat-title">
      <div class="mini-avatar">Yu</div>
      <span>於听</span>
    </div>
  </header>

  <div class="chat-body" id="chatBody"></div>

  <div class="chat-input" id="chatInput">
    <div class="input-hint" id="inputHint">选择你的回应…</div>
    <div class="options" id="options"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ================= 加载动画逻辑 ================= */
  window.addEventListener('load', () => {
    const loadingText = $('loadingText');
    
    function loopLoadingText() {
      let str = 'Loading';
      let i = 0;
      loadingText.innerHTML = '<span class="typing-cursor-load"></span>';
      
      function type() {
        if (i < str.length) {
          loadingText.innerHTML = str.substring(0, i + 1) + '<span class="typing-cursor-load"></span>';
          i++;
          setTimeout(type, 150);
        } else {
          setTimeout(() => { loadingText.innerHTML = str + ' .<span class="typing-cursor-load"></span>'; }, 200);
          setTimeout(() => { loadingText.innerHTML = str + ' ..<span class="typing-cursor-load"></span>'; }, 400);
          setTimeout(() => { loadingText.innerHTML = str + ' ...<span class="typing-cursor-load"></span>'; }, 600);
          setTimeout(loopLoadingText, 1400); 
        }
      }
      type();
    }
    
    loopLoadingText();

    setTimeout(() => {
      $('loadingScreen').classList.add('hide');
      $('profile').classList.add('active');
    }, 2600);
  });

  /* ================= 顶部菜单和喜欢交互 ================= */
  const bellBtn = $('bellBtn');
  const dropdownMenu = $('dropdownMenu');
  const redDot = $('redDot');
  const profileEl = $('profile');
  const noticePage = $('noticePage');
  const chatEl = $('chat');

  bellBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (redDot) redDot.style.opacity = '0';
    dropdownMenu.classList.toggle('show');
  });

  document.addEventListener('click', () => {
    dropdownMenu.classList.remove('show');
  });

  let isLiked = false;
  $('likeBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    isLiked = !isLiked;
    const heart = $('heartIcon');
    heart.style.color = isLiked ? '#ff3b30' : '#d1d1d1';
  });

  /* ================= 须知页面逻辑 ================= */
  const noticeTexts = [
    "le陪默认只接17+女板",
    "风格不固定介意勿点",
    "有动物塑喜好注意，毛茸茸重度依赖",
    "在开始前请告知称呼雷点，不接受隐雷客诉",
    "回合制选手，出现“…”安静听老婆的话",
    "低无/低代入/抽象请提前告知，单内你抽象我陪你抽",
    "不舒服及时喊停，在单期间不看小窗小群",
    "支持截屏自留，但未经允许请不要外传",
    "部分单内会打码做话术展示，介意可以和我说",
    "不接熟人/同团，披马甲别让我抓到你",
    "指定单不接受客诉退单",
    "单后习惯删好友 单外禁传"
  ];

  $('noticeModule').addEventListener('click', () => {
    profileEl.classList.remove('active');
    noticePage.classList.add('active');
    renderNoticeAnimation();
  });

  $('closeNoticeBtn').addEventListener('click', () => {
    noticePage.classList.remove('active');
    profileEl.classList.add('active');
  });

  function renderNoticeAnimation() {
    const container = $('noticeContent');
    container.innerHTML = '';
    let globalCharIndex = 0;
    
    noticeTexts.forEach(text => {
      const line = document.createElement('div');
      line.className = 'notice-line';
      
      for (let i = 0; i < text.length; i++) {
        const charSpan = document.createElement('span');
        charSpan.className = 'notice-char';
        charSpan.textContent = text[i];
        charSpan.style.animationDelay = `${globalCharIndex * 0.04}s`;
        line.appendChild(charSpan);
        globalCharIndex++;
      }
      container.appendChild(line);
    });
  }

  /* ================= 关注与进入聊天 ================= */
  let followed = false;
  $('followBtn').addEventListener('click', () => {
    const btn = $('followBtn');
    if (!followed) {
      followed = true;
      btn.textContent = '发消息';
    } else {
      openChat();
    }
  });

  let toastTimer = null;
  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
  $('pendingModule').addEventListener('click', () => showToast('未完待续…'));

  /* ================= 对话数据树 ================= */
  const dialog = {
    start: {
      messages: [],
      options: [
        { text: '我想你了', next: 'a' },
        { text: '嗨',       next: 'b_start' }
      ]
    },
    a: {
      messages: [
        { from: 'yu', text: '我也是。' },
        { from: 'yu', text: '想我就来找我吧，我一直都在。' }
      ],
      options: [
        { text: '真的吗', next: 'a1' },
        { text: '…骗子',  next: 'a2' }
      ]
    },
    a1: {
      messages: [
        { from: 'yu', text: '不然呢。' },
        { from: 'yu', text: '我的腿又不是摆设，是要追着你跑的。' }
      ],
      next: 'endA'
    },
    a2: {
      messages: [
        { from: 'yu', text: '哪句是谎话。' },
        { from: 'yu', text: '真的想你也真的想见你。' },
        { from: 'yu', text: '那我找根结实绳子把你捆回家吧。' },
        { from: 'yu', text: '天天能见面就不算我骗人了。' }
      ],
      next: 'endA'
    },
    endA: {
      messages: [
        { from: 'me', text: '油嘴滑舌…' },
        { from: 'yu', text: '来见我吧。' }
      ],
      end: true
    },
    b_start: {
      messages: [
        { from: 'yu', text: '这么生疏吗。' },
        { from: 'yu', text: '你该叫我什么呀。' }
      ],
      options: [
        { text: '你想我叫你什么', next: 'b' }
      ]
    },
    b: {
      messages: [
        { from: 'yu', text: '你想叫什么都可以。' },
        { from: 'yu', text: '只要是你叫的，我都听。' }
      ],
      options: [
        { text: '於听', next: 'b1' },
        { text: '还没想好', next: 'b2' }
      ]
    },
    b1: {
      messages: [
        { from: 'yu', text: '嗯，我在。' },
        { from: 'yu', text: '以后多叫叫我，好不好。' }
      ],
      end: true
    },
    b2: {
      messages: [
        { from: 'yu', text: '不急，慢慢想。' },
        { from: 'yu', text: '反正我有的是时间等你。' },
        { from: 'yu', text: '想好了随时告诉我。' }
      ],
      end: true
    }
  };

  /* ================= 对话引擎 ================= */
  let sessionId = 0;
  const chatBody  = $('chatBody');
  const optionsEl = $('options');
  const inputHint = $('inputHint');
  const chatInput = $('chatInput');

  function scrollToBottom() { chatBody.scrollTop = chatBody.scrollHeight; }

  async function typeMessage(text, from, sid) {
    if (sid !== sessionId) return;
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + from;
    
    const span = document.createElement('span');
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    cursor.textContent = '|'; 
    
    bubble.appendChild(span);
    bubble.appendChild(cursor);
    chatBody.appendChild(bubble);
    scrollToBottom();

    const baseSpeed = from === 'me' ? 20 : 35; 
    
    for (let i = 0; i < text.length; i++) {
      if (sid !== sessionId) return;
      const ch = text[i];
      span.textContent += ch;
      scrollToBottom();
      
      let extraDelay = 0;
      if (['，', '。', '！', '？', '…', '、'].includes(ch)) {
        extraDelay = 80 + Math.random() * 40; 
      }
      
      await sleep(baseSpeed + Math.random() * 10 + extraDelay);
    }
    
    if (sid !== sessionId) return;
    if (cursor.parentNode) bubble.removeChild(cursor);
    
    // 移除内部延迟，让消息连贯
    await sleep(from === 'me' ? 100 : 250); 
  }

  function showOptions(opts, sid) {
    if (sid !== sessionId) return;
    optionsEl.innerHTML = '';
    inputHint.textContent = '选择你的回应…';
    opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt.text;
      btn.style.animationDelay = (i * 0.05) + 's';
      btn.addEventListener('click', () => chooseOption(opt, sid));
      optionsEl.appendChild(btn);
    });
    scrollToBottom();
  }

  async function chooseOption(opt, sid) {
    if (sid !== sessionId) return;
    optionsEl.innerHTML = '';
    inputHint.textContent = '对方正在输入...';
    await typeMessage(opt.text, 'me', sid);
    if (sid !== sessionId) return;
    await sleep(200); 
    runNode(opt.next);
  }

  async function runNode(key) {
    const sid = sessionId;
    const node = dialog[key];
    if (!node) return;

    for (const m of (node.messages || [])) {
      if (sid !== sessionId) return;
      await typeMessage(m.text, m.from, sid);
      await sleep(100); 
    }
    if (sid !== sessionId) return;

    if (node.end) return finishChat(sid);
    if (node.options) return showOptions(node.options, sid);
    if (node.next) return runNode(node.next);
  }

  // 说完最后一句直接结束，无延迟
  function finishChat(sid) {
    if (sid !== sessionId) return;
    
    chatInput.classList.add('disabled');
    inputHint.textContent = '对话已结束';
    optionsEl.innerHTML = '';
    
    const btn = document.createElement('button');
    btn.className = 'back-home-btn';
    btn.textContent = '返回主页';
    btn.addEventListener('click', backToProfile);
    optionsEl.appendChild(btn);
    scrollToBottom();
  }

  function openChat() {
    profileEl.classList.remove('active');
    chatEl.classList.add('active');
    sessionId++; 
    chatBody.innerHTML = '';
    optionsEl.innerHTML = '';
    chatInput.classList.remove('disabled');
    inputHint.textContent = '选择你的回应…';
    setTimeout(() => runNode('start'), 200);
  }

  function backToProfile() {
    sessionId++;
    chatEl.classList.remove('active');
    profileEl.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  $('chatBack').addEventListener('click', backToProfile);
</script>
</body>
</html>
